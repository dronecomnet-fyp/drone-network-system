# Node configuration: DRONE_B (volunteer drone comm module)
# Consumed by deploy/setup_node.sh. Shell syntax, no spaces around '='.

NODE_ID=DRONE_B
USER_AP_SSID=RESCUE_B
USER_AP_CHANNEL=36
DTN_IP=10.99.0.2
DTN_PEERS=10.99.0.1,10.99.0.3

DRONE_CONTROL=false
FC_SERIAL=

AUX_SERIAL=/dev/ttyACM0

# Front panel: power switch, startup beep, READY and MESH lamps (field
# backlog #1). Set true only once the hardware is actually soldered on;
# wiring and parts are in docs/NODE_PANEL.md.
INDICATOR=false

ONBOARD_MAC=
DTN_MAC=

# NOT USED for interface naming any more, kept only as a record of which
# adapter this node normally carries. wlan1 is matched by DRIVER
# (ath9k_htc), because cheap AR9271 dongles do not all have a stable
# unique MAC and pinning a name to a changing address is what made wlan0
# and wlan1 swap after a reboot. Any AR9271 in any port becomes wlan1.
DTN_MAC_ALT=
