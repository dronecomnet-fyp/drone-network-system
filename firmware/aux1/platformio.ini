; ESP32-C3 aux module unified firmware (file 03).
; Board: Seeed Studio XIAO ESP32-C3.
; Library versions PINNED for a reproducible build (project rule on
; reproducibility; the Arduino IDE alternative is documented in README.md).

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; monitor_dtr/monitor_rts were pinned to 0 here for a while on the theory
; that the XIAO's native USB ignores them. That was a guess, it did not
; fix a silent monitor, and forcing DTR inactive is itself suspect: the
; ESP32 USB CDC driver uses DTR to decide whether a host is attached.
; Left at the default rather than guessing again in the other direction.
;
; Worth knowing regardless: "pio run -t upload" ends with "Hard resetting
; via RTS pin", which needs a USB-to-serial bridge the XIAO does not
; have. Press the RESET button after flashing.

; Native USB CDC is the Pi link (design v3: /dev/ttyACM0 at 115200).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    sandeepmistry/LoRa@0.8.0
    mikalhart/TinyGPSPlus@1.0.3
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.3
